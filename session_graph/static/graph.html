<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* Layout: a full-window canvas (pan, zoom, drag nodes) with floating glass chrome, a history sidebar on the left,
   and a large sheet over the canvas for the selected node.
   Palette primitives: #28301C deep olive, #323D25 olive, #9A7E3B ochre, #D2CF9A khaki. Signal colors stay system green/amber/red. */
:root {
  --bg: #EFEEE3; --bg-glow: #F8F7EF; --surface: #FBFAF5; --surface-hover: #F1F0E4; --border: rgba(40, 48, 28, 0.12);
  --text: #28301C; --text-secondary: #6A705A; --accent: #323D25; --on-accent: #EEEBCB; --accent-secondary: #9A7E3B;
  --positive: #34C759; --negative: #FF3B30; --warning: #FF9500;
  --edge: rgba(50, 61, 37, 0.30); --live: #9A7E3B;
  --glass: rgba(251, 250, 245, 0.76); --glass-edge: rgba(40, 48, 28, 0.08); --shadow: rgba(40, 48, 28, 0.14);
  --scrim: rgba(40, 48, 28, 0.22); --tint: rgba(40, 48, 28, 0.055);
  --master-fill: #28301C; --master-ink: #D2CF9A;
  --folder-fill: #F3EAD3; --folder-stroke: rgba(154, 126, 59, 0.50); --folder-ink: #9A7E3B; --folder-soft: rgba(154, 126, 59, 0.16);
  --session-fill: #E8ECDB; --session-stroke: rgba(50, 61, 37, 0.26); --session-ink: #323D25;
  --agent-fill: #F6F4DE; --agent-stroke: #CBC78B; --agent-ink: #8A8644;
  --code-bg: #F3F2E7; --hl-kw: #6B5420; --hl-str: #4E6A2C; --hl-num: #8A5A2B; --hl-fn: #28301C; --hl-type: #7A6A1E;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14180F; --bg-glow: #1D2316; --surface: #1F2619; --surface-hover: #283020; --border: rgba(210, 207, 154, 0.13);
    --text: #ECEAD3; --text-secondary: #A3A68A; --accent: #D2CF9A; --on-accent: #28301C; --accent-secondary: #C9A85E;
    --positive: #30D158; --negative: #FF453A; --warning: #FF9F0A;
    --edge: rgba(210, 207, 154, 0.24); --live: #C9A85E;
    --glass: rgba(31, 38, 25, 0.76); --glass-edge: rgba(210, 207, 154, 0.10); --shadow: rgba(0, 0, 0, 0.55);
    --scrim: rgba(8, 10, 5, 0.5); --tint: rgba(210, 207, 154, 0.08);
    --master-fill: #D2CF9A; --master-ink: #28301C;
    --folder-fill: #3A311F; --folder-stroke: rgba(201, 168, 94, 0.55); --folder-ink: #C9A85E; --folder-soft: rgba(201, 168, 94, 0.18);
    --session-fill: #263020; --session-stroke: rgba(160, 180, 120, 0.32); --session-ink: #B9C79A;
    --agent-fill: #2E2F20; --agent-stroke: rgba(210, 207, 154, 0.34); --agent-ink: #D2CF9A;
    --code-bg: #171C11; --hl-kw: #D9B86A; --hl-str: #B5C98A; --hl-num: #E0A86A; --hl-fn: #ECEAD3; --hl-type: #CFC27A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-secondary); outline-offset: 2px; }

/* canvas: a soft light falloff instead of a pattern */
#canvas { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(1400px 900px at 50% 38%, var(--bg-glow), var(--bg) 72%); }
#canvas.panning { cursor: grabbing; }
#svg { width: 100%; height: 100%; display: block; }
.empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--text-secondary); pointer-events: none; }

/* graph marks */
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.edge.agent { stroke-dasharray: 3 4; }
.edge.sub { stroke: var(--session-ink); stroke-opacity: 0.5; stroke-dasharray: 8 5; }
.edge.dim { opacity: 0.45; }
.edge.live { stroke: var(--live); stroke-opacity: 0.85; stroke-dasharray: 5 7; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.node { cursor: pointer; outline: none; }
.node.dragging { cursor: grabbing; }
.node .in { transform-box: fill-box; transform-origin: center; transition: transform 110ms ease-out; }
.node.pressed .in { transform: scale(0.97); }
.node .box { stroke-width: 1; }
.node.folder .box { fill: var(--folder-fill); stroke: var(--folder-stroke); }
.node.session .box { fill: var(--session-fill); stroke: var(--session-stroke); }
.node.agent .box { fill: var(--agent-fill); stroke: var(--agent-stroke); }
.node:focus-visible .box, .node.sel .box { stroke: var(--accent-secondary); stroke-width: 2; }
.node .nm { font: 600 13px var(--font); fill: var(--text); letter-spacing: -0.01em; }
.node .sub { font: 400 11.5px var(--font); fill: var(--text-secondary); }
.node .tagt { font: 600 9.5px var(--font); letter-spacing: 0.06em; }
.node.session .tagt { fill: var(--session-ink); }
.node.folder .ico { fill: none; stroke: var(--folder-ink); stroke-width: 1.5; stroke-linejoin: round; }
.node .cnt { font: 600 10.5px var(--font); fill: var(--folder-ink); text-anchor: middle; }
.node .fclose { opacity: 0; transition: opacity 120ms ease-out; cursor: pointer; }
.node.folder:hover .fclose, .node.folder:focus-within .fclose, .node .fclose.armed { opacity: 1; }
.node .fclose .fbg { fill: var(--folder-soft); }
.node .fclose:hover .fbg { fill: var(--folder-stroke); }
.node .fclose .fic { fill: none; stroke: var(--folder-ink); stroke-width: 1.5; stroke-linecap: round; }
.node .fclose.armed .fbg { fill: var(--negative); }
.node .fclose.armed .fic { stroke: #fff; }
.node .cntbg { fill: var(--folder-soft); }

.dot { fill: var(--text-secondary); }
.st-working .dot { fill: var(--positive); }
.ring { fill: var(--positive); transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: 0.5; } to { transform: scale(2.6); opacity: 0; } }
.st-waiting .dot { fill: var(--warning); }
.node.st-waiting .box { stroke: var(--warning); stroke-width: 1.6; }
.pause { fill: var(--text-secondary); }
.st-paused .nm { fill: var(--text-secondary); }
.st-closed { opacity: 0.45; }
.node.st-closed .box { stroke-dasharray: 4 3; }
.st-stopped .dot { fill: none; stroke: var(--text-secondary); stroke-width: 1.4; }
.xmark { fill: none; stroke: var(--text-secondary); stroke-width: 1.6; stroke-linecap: round; }
.check { fill: none; stroke: var(--agent-ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.m-core { fill: var(--master-fill); }
.m-ring { fill: var(--live); transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
.m-t { font: 600 12px var(--font); fill: var(--master-ink); text-anchor: middle; letter-spacing: -0.01em; }
#shadow feDropShadow { flood-color: var(--shadow); }

/* floating chrome */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-edge); box-shadow: 0 1px 2px var(--shadow), 0 8px 24px -8px var(--shadow); border-radius: 12px; }
.chrome { position: fixed; z-index: 5; display: flex; align-items: center; gap: 8px; }
.tl { top: 14px; left: 14px; padding: 3px 12px 3px 3px; }
.tl .logo { width: 10px; height: 10px; border-radius: 50%; background: var(--master-fill); box-shadow: 0 0 0 3px var(--folder-soft); }
.tl .ttl { font: 600 13px var(--font-display); letter-spacing: -0.01em; }
.conn { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); opacity: 0.5; }
.conn.on { background: var(--positive); opacity: 1; }
.tr { top: 14px; right: 14px; }
.pill { display: flex; align-items: center; gap: 14px; padding: 7px 12px; }
.meter { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.meter b { color: var(--text); font-weight: 600; }
.meter .track { width: 54px; height: 4px; border-radius: 2px; background: var(--tint); overflow: hidden; }
.meter .track i { display: block; height: 100%; border-radius: 2px; background: var(--accent-secondary); }
.meter.warning .track i { background: var(--warning); }
.meter.critical .track i { background: var(--negative); }
.meter .pct { font-variant-numeric: tabular-nums; color: var(--text); }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0; border: 0; background: transparent; border-radius: 8px; color: var(--text); flex: none; }
.ib:hover { background: var(--tint); }
.ib:active { transform: scale(0.94); }
.ib[disabled] { opacity: 0.4; cursor: default; }
.ib svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.glass.ib { width: 34px; height: 34px; border-radius: 10px; }
.ib.on { background: var(--tint); color: var(--accent-secondary); }
.ib.txt { width: auto; padding: 0 10px; font: 500 12px var(--font); }
.ib.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 40% { background: var(--folder-soft); color: var(--accent-secondary); } 100% { background: transparent; } }
.ib.armed { background: var(--negative); color: #fff; }
.chip-up { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 5px 11px; font: 600 12px var(--font); }
.br { right: 14px; bottom: 14px; padding: 3px; gap: 2px; }
.br .pct { min-width: 50px; height: 32px; border: 0; background: transparent; border-radius: 8px; font: 500 12px var(--font); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.br .pct:hover { background: var(--tint); }
.vsep { width: 0.5px; height: 18px; background: var(--border); margin: 0 3px; flex: none; }
.bl { left: 16px; bottom: 16px; font: 400 11px var(--font); color: var(--text-secondary); gap: 12px; font-variant-numeric: tabular-nums; transition: left 280ms cubic-bezier(0.2, 0.8, 0.2, 1); }
body.hist-open .bl { left: 348px; }
.bc { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 8px 6px 14px; font-size: 13px; }
.bc button { border: 0; background: transparent; color: var(--accent-secondary); font-weight: 600; padding: 4px 8px; border-radius: 8px; }
.bc button:hover { background: var(--tint); }

/* history sidebar */
.hist { position: fixed; z-index: 6; top: 60px; left: 14px; bottom: 14px; width: 320px; display: flex; flex-direction: column; overflow: hidden;
  border-radius: 14px; transform: translateX(calc(-100% - 20px)); transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1); visibility: hidden; }
body.hist-open .hist { transform: none; visibility: visible; }
.hist-h { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.hist-h .row { display: flex; align-items: center; gap: 6px; }
.hist-h h2 { margin: 0; flex: 1; font: 600 15px var(--font-display); letter-spacing: -0.015em; padding-left: 4px; }
.search { width: 100%; border: 0; border-radius: 9px; background: var(--tint); padding: 7px 10px; outline: none; }
.hist-list { flex: 1; overflow: auto; padding: 0 6px 10px; }
.hgrp { font: 600 11px var(--font); color: var(--text-secondary); padding: 12px 8px 4px; letter-spacing: 0.02em; }
.hrow { border-radius: 10px; padding: 7px 8px; cursor: pointer; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.hrow:hover, .hrow.sel { background: var(--tint); }
.hrow .t { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .m { grid-column: 2 / 4; font-size: 11.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .m b { color: var(--folder-ink); font-weight: 600; }
.hrow .when { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.hdot { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.hdot.working { background: var(--positive); } .hdot.waiting { background: var(--warning); }
.hdot.idle, .hdot.live { background: var(--session-ink); } .hdot.paused { box-shadow: inset 0 0 0 1.5px var(--session-ink); }
.hdot.closed { box-shadow: inset 0 0 0 1.5px var(--text-secondary); }
.hmore { grid-column: 2 / 4; font-size: 12px; color: var(--text-secondary); padding-top: 4px; display: flex; flex-direction: column; gap: 8px; }
.hmore p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.hmore .btn { align-self: flex-start; }
.hist-empty { padding: 30px 12px; text-align: center; color: var(--text-secondary); font-size: 13px; }

/* trash: closed sessions wait here until the 4:00 cleanup deletes them; red so it never reads as History */
.ib.trash, .ib.trash.on { color: var(--negative); }
.ib.trash.flash { animation: flash-trash 1.4s ease-out; }
@keyframes flash-trash { 0%, 40% { background: color-mix(in srgb, var(--negative) 18%, transparent); } 100% { background: transparent; } }
.ib.trash.full { width: auto; padding: 0 8px; display: inline-flex; gap: 4px; }
.tcount { font: 600 12px var(--font); font-variant-numeric: tabular-nums; }
.hist-sub { display: none; margin: -4px 0 0; padding-left: 4px; font-size: 12px; color: var(--text-secondary); }
body.trash-mode .hist-sub:not(:empty) { display: block; }
body.trash-mode #h-title { color: var(--negative); }
body.trash-mode #h-refresh, body.trash-mode #h-search { display: none; }
.trow { grid-template-columns: 10px minmax(0, 1fr) auto auto; cursor: default; }
.trow .m { grid-column: 2 / 4; }
.trow .ib { grid-column: 4; grid-row: 1 / 3; width: 28px; height: 28px; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 10; background: var(--scrim); opacity: 0; }
.sheet { position: fixed; inset: 0; margin: auto; z-index: 11; width: min(1060px, calc(100vw - 32px)); height: min(88vh, 940px);
  display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 0.5px var(--border), 0 30px 90px -20px var(--shadow), 0 8px 24px -12px var(--shadow);
  transform-origin: center; will-change: transform, opacity; opacity: 0; }
.sh-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 14px 24px; }
.sh-title { flex: 1; min-width: 0; }
.kind { font: 600 10.5px var(--font); letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.kind.master { color: var(--accent-secondary); } .kind.folder { color: var(--folder-ink); } .kind.session { color: var(--session-ink); } .kind.agent { color: var(--agent-ink); }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-secondary); }
.sdot.working { background: var(--positive); } .sdot.waiting { background: var(--warning); }
.sdot.paused, .sdot.closed, .sdot.stopped { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-secondary); }
.sdot.none { display: none; }
.sh-title h2, .rename { padding: 1px 5px; margin: -1px -5px; border-radius: 7px; }
.sh-title h2 { margin-top: 0; margin-bottom: 0; font: 600 20px/1.2 var(--font-display); letter-spacing: -0.022em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-title h2.can-rename { cursor: text; }
.sh-title h2.can-rename:hover { background: var(--tint); }
.rename { display: block; width: calc(100% + 10px); font: 600 20px/1.2 var(--font-display); letter-spacing: -0.022em; border: 0; background: var(--tint); outline: none; box-shadow: 0 0 0 2px var(--folder-stroke); }
.sh-title p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-tools { display: flex; gap: 2px; align-items: center; }
.col { width: 100%; max-width: 880px; margin: 0 auto; padding: 0 28px; }
.pform { padding: 4px 0 16px; }
.pform .col { display: flex; flex-direction: column; gap: 8px; }
.pform .row { display: flex; gap: 8px; align-items: center; }
.pform .row > * { min-width: 0; }
.field { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 8px 11px; }
textarea.field { resize: vertical; min-height: 84px; }
.btn { border: 0; border-radius: 9px; padding: 8px 16px; font-weight: 600; background: var(--tint); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn:active { transform: scale(0.97); }
.note { font-size: 12.5px; color: var(--text-secondary); padding-bottom: 10px; }
.perms .col { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
.perms:empty { display: none; }
.perm { border-radius: 14px; padding: 12px 14px; background: color-mix(in srgb, var(--warning) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 35%, transparent); }
.perm-h { font-size: 13px; }
.perm-h .who { color: var(--text-secondary); }
.perm pre { margin: 8px 0; padding: 8px 10px; background: var(--surface); border-radius: 8px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
.perm .row { display: flex; gap: 8px; justify-content: flex-end; }
.stream { flex: 1; overflow: auto; border-top: 0.5px solid var(--border); padding: 10px 0 18px; }
.sep-t { text-align: center; font-size: 11px; color: var(--text-secondary); padding: 14px 0 6px; }
.lbl { font-size: 11.5px; font-weight: 600; padding: 10px 0 2px; color: var(--session-ink); }
.lbl.agent { color: var(--agent-ink); }
.you { display: flex; justify-content: flex-end; padding: 5px 0; }
.you .b { background: var(--accent); color: var(--on-accent); border-radius: 18px; padding: 8px 14px; max-width: 74%; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.say { padding: 5px 0 2px; overflow-wrap: anywhere; line-height: 1.6; user-select: text; }
.say.plain { white-space: pre-wrap; }
.say.collapsed { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
/* rendered markdown */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 0.65em; }
.md ul, .md ol { margin: 0 0 0.65em; padding-left: 1.4em; } .md li { margin: 0.15em 0; }
.md h1, .md h2, .md h3, .md h4 { font: 600 1.02em/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0.9em 0 0.4em; }
.md h1 { font-size: 1.22em; } .md h2 { font-size: 1.12em; }
.md code { font: 0.88em/1.4 var(--mono); background: var(--tint); border-radius: 5px; padding: 0.1em 0.35em; }
.md pre { background: var(--code-bg); border-radius: 10px; padding: 12px 14px; overflow: auto; margin: 0.4em 0 0.8em; box-shadow: inset 0 0 0 0.5px var(--border); }
.md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; white-space: pre; }
.md blockquote { margin: 0 0 0.65em; padding-left: 12px; border-left: 3px solid var(--folder-stroke); color: var(--text-secondary); }
.md table { border-collapse: collapse; margin: 0 0 0.8em; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--tint); font-weight: 600; }
.md a { color: var(--accent-secondary); text-underline-offset: 2px; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.md strong { font-weight: 650; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--hl-kw); font-weight: 600; }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attr .hljs-string { color: var(--hl-str); }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--hl-num); }
.hljs-comment, .hljs-quote, .hljs-deletion { color: var(--text-secondary); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--hl-fn); font-weight: 600; }
.hljs-type, .hljs-built_in, .hljs-class .hljs-title, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-meta { color: var(--hl-type); }
.fold { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--text-secondary); padding: 2px 6px 2px 2px; border-radius: 6px; font-size: 11.5px; margin-bottom: 4px; }
.fold:hover { background: var(--tint); color: var(--text); }
.fold svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms ease; }
.fold[aria-expanded="true"] svg { transform: rotate(180deg); }
.act { display: flex; gap: 8px; padding: 2px 0; font: 12px/1.6 var(--mono); color: var(--text-secondary); min-width: 0; }
.act b { font: 600 12px/1.6 var(--font); color: var(--text); flex: none; }
.act span { overflow-wrap: anywhere; min-width: 0; }
.thk { padding: 2px 0; font-size: 12px; color: var(--text-secondary); }
.none { padding: 40px 0; text-align: center; color: var(--text-secondary); }
.toast { font-size: 12.5px; color: var(--negative); }

.compose { padding: 10px 0 18px; border-top: 0.5px solid var(--border); }
.compose .col { position: relative; }
.bubble-in { display: flex; align-items: flex-end; gap: 6px; border: 1px solid var(--border); border-radius: 22px; background: var(--bg); padding: 5px 5px 5px 16px; }
.bubble-in:focus-within { border-color: var(--folder-stroke); }
.bubble-in textarea { flex: 1; min-width: 0; min-height: 33px; border: 0; background: transparent; resize: none; outline: none; padding: 6px 0; max-height: 220px; font-size: 14.5px; line-height: 1.45; }
.opts .tbtn { border: 0; background: var(--tint); border-radius: 999px; min-width: 28px; height: 24px; padding: 0 9px; font: 600 12.5px var(--mono); color: var(--text-secondary); }
.opts .tbtn:hover { color: var(--text); }
.opts .tbtn:active { transform: scale(0.95); }
.opts .tbtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
/* attachments */
.atts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 8px; }
.att { display: inline-flex; align-items: center; gap: 8px; max-width: 260px; padding: 4px 4px 4px 4px; border-radius: 11px; background: var(--tint); font-size: 12px; }
.att img { width: 38px; height: 38px; object-fit: cover; border-radius: 8px; flex: none; }
.att .ficon { width: 38px; height: 38px; border-radius: 8px; background: var(--folder-soft); color: var(--folder-ink); display: grid; place-items: center; font: 600 9.5px var(--mono); text-transform: uppercase; flex: none; }
.att .an { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.att .an b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .an span { color: var(--text-secondary); font-size: 11px; }
.att .ib { width: 24px; height: 24px; }
.att .ib svg { width: 12px; height: 12px; }
.compose.drop .bubble-in { border-color: var(--accent-secondary); box-shadow: 0 0 0 3px var(--folder-soft); }
.you .att-line { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.you .att-line:first-child { margin-top: 0; }
.you .att-chip { font-size: 11.5px; background: color-mix(in srgb, var(--on-accent) 18%, transparent); border-radius: 6px; padding: 1px 7px; }
/* the new-session form's menus open downward: the form sits at the top */
.pform .opts-row { flex-wrap: wrap; }
.opt.down .menu { top: calc(100% + 6px); bottom: auto; transform-origin: top left; animation-name: menu-down; }
@keyframes menu-down { from { opacity: 0; transform: translateY(-5px) scale(0.97); } }
.opt.down .opt-b svg { transform: none; }
.opt.right .menu { left: auto; right: 0; transform-origin: top right; }
/* top right: usage, and under it the defaults for new sessions */
.chrome.tr { flex-direction: column; align-items: flex-end; }
.tr-row { display: flex; align-items: center; gap: 8px; }
.defs { padding: 3px 4px 3px 10px; gap: 2px; }
.defs-ic { width: 13px; height: 13px; fill: none; stroke: var(--text-secondary); stroke-width: 1.8; stroke-linecap: round; margin-right: 2px; }
.defs .opt-b { background: transparent; }
.defs .opt-b:hover, .defs .opt-b[aria-expanded="true"] { background: var(--tint); }
/* Master: activity statistics (one hue per chart; text stays in text colors) */
.stats { flex: 1; overflow: auto; border-top: 0.5px solid var(--border); padding: 18px 0 26px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--tint); border-radius: 12px; padding: 12px 14px 11px; }
.kpi .l, .card .cs, .kpi .n { font-size: 12px; color: var(--text-secondary); }
.kpi .v { font: 600 28px/1.15 var(--font-display); letter-spacing: -0.02em; margin: 3px 0 1px; }
.kpi .n { font-size: 11.5px; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.card { border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px 12px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { margin: 0; font: 600 13px var(--font); }
.card .cs { font-size: 11.5px; margin-top: 2px; }
.days { display: flex; height: 132px; margin-top: 14px; border-bottom: 1px solid var(--border); }
.day { flex: 1; position: relative; outline: none; }
.day .bar { position: absolute; left: 50%; bottom: 0; width: min(24px, 56%); height: var(--h); transform: translateX(-50%); border-radius: 4px 4px 0 0;
  background: color-mix(in srgb, var(--session-ink) 34%, transparent); }
.day.today .bar { background: var(--session-ink); }
.day .val { position: absolute; left: 0; right: 0; bottom: calc(var(--h) + 4px); text-align: center; font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.day:hover .bar, .day:focus-visible .bar { filter: brightness(1.18); }
.dlabels { display: flex; }
.dlabels span { flex: 1; text-align: center; font-size: 10.5px; color: var(--text-secondary); padding-top: 5px; }
.dlabels span.today { color: var(--text); font-weight: 600; }
.folders { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.frow { display: grid; grid-template-columns: minmax(0, 92px) minmax(0, 1fr); gap: 10px; align-items: center; height: 24px; border-radius: 6px; outline: none; }
.frow .fn { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .ft { display: flex; align-items: center; gap: 6px; min-width: 0; }
.frow .fb { flex: none; height: 12px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--folder-ink); }
.frow .fv { font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.frow:hover .fb, .frow:focus-visible .fb { filter: brightness(1.18); }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; margin-top: 14px; }
.hours i { height: 34px; border-radius: 3px; background: var(--tint); outline: none; }
.hours i:hover, .hours i:focus-visible { box-shadow: 0 0 0 1.5px var(--text-secondary); }
.hticks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 10.5px; color: var(--text-secondary); padding-top: 5px; font-variant-numeric: tabular-nums; }
.stats-empty { color: var(--text-secondary); font-size: 12.5px; padding: 18px 0 6px; }
.stip { position: fixed; z-index: 20; pointer-events: none; padding: 6px 10px; border-radius: 9px; font-size: 12px; display: flex; flex-direction: column; gap: 1px; max-width: 260px; }
.stip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.stip span { color: var(--text-secondary); }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cards { grid-template-columns: minmax(0, 1fr); } }

/* folder view: a window per session in the folder; clicking one opens it */
.panes { flex: 1; min-height: 0; overflow: hidden; border-top: 0.5px solid var(--border); padding: 16px 20px; display: grid; gap: 14px; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-radius: 14px; background: var(--session-fill); box-shadow: inset 0 0 0 1px var(--session-stroke); overflow: hidden; cursor: pointer; transition: box-shadow 150ms ease, transform 110ms ease-out; }
.pane:hover, .pane:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-secondary); outline: none; }
.pane:active { transform: scale(0.99); }
.pane-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px 8px; }
.pane-h b { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-h .pst { flex: none; font-size: 11px; color: var(--text-secondary); }
.pane-b { flex: 1; overflow: auto; padding-bottom: 10px; font-size: 12.5px; -webkit-mask-image: linear-gradient(transparent, #000 28px); mask-image: linear-gradient(transparent, #000 28px); }
.pane .col { padding: 0 14px; }
.pane .you .b { padding: 6px 11px; font-size: 12.5px; }
.pane .say { font-size: 12.5px; }
.pane .md pre code { font-size: 11.5px; }
.pane .sep-t { padding: 8px 0 4px; }
.pane .none { padding: 30px 0; }
.panes-empty { color: var(--text-secondary); padding: 30px 10px; }
.bubble-in textarea::placeholder { color: var(--text-secondary); opacity: 0.8; }
.key { align-self: center; font: 600 10px var(--font); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
.send { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.send[disabled] { opacity: 0.35; cursor: default; }
.opts { display: flex; gap: 6px; padding: 8px 0 0 4px; flex-wrap: wrap; }
.opt { position: relative; display: inline-flex; }
.opt-b { display: inline-flex; align-items: center; gap: 5px; border: 0; background: var(--tint); border-radius: 999px; height: 24px; padding: 0 8px 0 11px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.opt-b:hover, .opt-b[aria-expanded="true"] { color: var(--text); }
.opt-b:active { transform: scale(0.97); }
.opt-b svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transform: rotate(180deg); }
.opt-b.busy { opacity: 0.5; }
.opt-b .fic { width: 13px; height: 13px; transform: none; stroke-width: 1.5; }
.mopt .opt-v { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.opt.nocap { display: none !important; }
/* menus open upward from their button: they live at the bottom of the sheet */
.menu { position: absolute; left: 0; bottom: calc(100% + 6px); min-width: 230px; max-width: 340px; max-height: min(50vh, 380px); overflow: auto; padding: 5px; z-index: 3;
  transform-origin: bottom left; animation: menu-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes menu-in { from { opacity: 0; transform: translateY(5px) scale(0.97); } }
.mi { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 8px; align-items: center; padding: 6px 10px 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
.mi.on { background: var(--tint); }
.mi .ck { grid-row: 1 / 3; width: 14px; height: 14px; fill: none; stroke: var(--accent-secondary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.mi[aria-selected="true"] .ck { visibility: visible; }
.mi .md2 { grid-column: 2; font-size: 11.5px; line-height: 1.35; color: var(--text-secondary); }
.send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ac { position: absolute; left: 28px; right: 28px; bottom: calc(100% + 6px); max-height: 320px; overflow: auto; border-radius: 12px; padding: 5px; z-index: 2; }
.ac-i { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; cursor: pointer; min-width: 0; }
.ac-i.on { background: var(--tint); }
.ac-i b { font: 600 13px var(--font); color: var(--session-ink); flex: none; }
.ac-i .hint { font: 12px var(--mono); color: var(--text-secondary); flex: none; }
.ac-i .d { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ac-i .f { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }

@media (max-width: 640px) {
  .sheet { width: 100vw; height: 92vh; margin: auto 0 0; border-radius: 18px 18px 0 0; }
  .col { padding: 0 16px; }
  .ac { left: 16px; right: 16px; }
  .meter .track { display: none; }
  .bl { display: none; }
  .hist { width: calc(100vw - 28px); }
}
@media (prefers-reduced-motion: reduce) {
  .ring, .m-ring, .edge.live { animation: none; }
  .ring, .m-ring { opacity: 0; }

}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

<script>
(function () {
"use strict";
var TOKEN = "__GRAPH_TOKEN__";
var SVGNS = "http://www.w3.org/2000/svg";
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

var store = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } }

var RM = window.matchMedia("(prefers-reduced-motion: reduce)");

/* ------------------------------------------------ state */
var G = null, boot = null, ready = false;
var EV = new Map(), N = new Map(), EDGES = new Map();
var saved = store.get("sg.pos", {});
var cam = { x: 0, y: 0, k: 1 }, camVel = { x: 0, y: 0 }, camAnim = null;
var drag = null;
var sheet = { id: null, p: 0, v: 0, target: 0, ox: 0, oy: 0 };
var forms = { new: false, agent: false };
var drafts = new Map(), collapsed = new Set(), CMDS = new Map();
var armed = null, armTimer = 0, toastTimer = 0, undoTimer = 0, undoSaved = null, camSaveTimer = 0;
var lastStreamKey = "", renaming = null, composerMode = null;
var raf = 0, lastT = 0;
var canvas = $("#canvas"), svg = $("#svg"), world = $("#world"), gEdges = $("#edges"), gNodes = $("#nodes");
var sheetEl = $("#sheet"), scrim = $("#scrim");

var SIZE = { master: [60, 60], folder: [184, 50], session: [244, 54], agent: [204, 44] };
var ROW = 66;
var FOLDER_W = 184, FOLDER_MAX = 340, folderExtra = 0;
function colX(d) { var c = [0, 170, 424, 690, 932], x = d < c.length ? c[d] : 932 + (d - 4) * 242; return d >= 2 ? x + folderExtra : x; }
/* A folder block is as wide as its name and path need (between FOLDER_W and FOLDER_MAX); its left edge stays put. */
var measureCtx = document.createElement("canvas").getContext("2d");
function textW(str, font) { measureCtx.font = font + " " + getComputedStyle(document.body).fontFamily; return measureCtx.measureText(str).width; }
function folderSub(f) { return f.path.split("/").slice(-2).join("/"); }
function folderW(f) {
  var need = 84 + Math.max(textW(f.name, "600 13px"), textW(folderSub(f), "400 11.5px"));
  return Math.round(Math.max(FOLDER_W, Math.min(FOLDER_MAX, need)));
}
function fitText(str, font, px) {
  if (textW(str, font) <= px) return str;
  var lo = 0, hi = str.length;
  while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (textW(str.slice(0, mid) + "…", font) <= px) lo = mid; else hi = mid - 1; }
  return str.slice(0, lo) + "…";
}
function dims(kind, d) { var s = SIZE[kind]; return kind === "folder" && d ? [d.w || s[0], s[1]] : s; }

/* ------------------------------------------------ springs (damping ratio + response) */
function spring(o, k, vk, target, dt, response, damping) {
  var w = 2 * Math.PI / response, K = w * w, C = 2 * damping * w;
  var n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (var i = 0; i < n; i++) { var a = -K * (o[k] - target) - C * o[vk]; o[vk] += a * h; o[k] += o[vk] * h; }
}
function settled(o, k, vk, target, eps) { return Math.abs(o[k] - target) < eps && Math.abs(o[vk]) < eps * 2; }
function kick() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }

/* ------------------------------------------------ connection */
function connect() {
  var es = new EventSource("/api/events");
  es.onopen = function () { setConn(true); };
  es.onerror = function () { setConn(false); };
  es.onmessage = function (m) {
    var d = JSON.parse(m.data);
    if (boot && d.graph.boot !== boot) { EV.clear(); CMDS.clear(); }
    boot = d.graph.boot;
    d.events.forEach(addEvent);
    G = d.graph;
    // closed sessions leave the graph at once; they wait in Trash until the cleanup deletes them
    G.folderNames = {}; G.folders.forEach(function (f) { G.folderNames[f.id] = f.name; });
    var closedSids = new Set(G.sessions.filter(function (s) { return s.status === "closed"; }).map(function (s) { return s.sid; }));
    G.closed = G.sessions.filter(function (s) { return closedSids.has(s.sid); });
    G.sessions = G.sessions.filter(function (s) { return !closedSids.has(s.sid); });
    G.agents = G.agents.filter(function (a) { return !closedSids.has(a.sid); });
    G.folders = G.folders.filter(function (f) { return G.sessions.some(function (s) { return s.folder === f.id; }); });
    // a folder picked from Master waits here, empty, until its first session starts; then the real one takes over
    var moveTo = null;
    PICKED = PICKED.filter(function (v) {
      var real = G.folders.some(function (f) { return f.id === v.id; }), first = G.sessions.find(function (s) { return s.cwd === v.path; });
      if (!real && !first) return true;
      if (sheet.id === v.id && !real) moveTo = first.folder; // it joined a project's folder: follow it there
      return false;
    });
    G.folders = G.folders.concat(PICKED);
    if (moveTo) openSheet(moveTo);
    sync();
    renderChrome();
    renderTrash();
    if (sheet.id) renderSheet();
    if (!ready) {
      ready = true;
      var c = store.get("sg.cam", null);
      if (c && c.length === 3) { cam.x = c[0]; cam.y = c[1]; cam.k = c[2]; applyCam(); } else fit(false);
      var side = store.get("sg.side", store.get("sg.hist", false) ? "history" : "");
      if (side === "history" || side === "trash") toggleSide(side, true);
    }
  };
}
function setConn(on) { var c = $("#conn"); c.classList.toggle("on", on); c.title = on ? "Live" : "Reconnecting"; }
function addEvent(e) {
  var a = EV.get(e.node);
  if (!a) { a = []; EV.set(e.node, a); }
  if (a.length && a[a.length - 1].seq >= e.seq) return;
  a.push(e);
  if (a.length > 300) a.splice(0, a.length - 300);
}
function act(action, body) {
  return fetch("/api/" + action, { method: "POST", headers: { "Content-Type": "application/json", "X-Graph-Token": TOKEN }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || "The helper returned " + r.status); return d; }); });
}
function toast(msg) {
  var el = $("#f-reply").hidden ? $("#toast-alt") : $("#toast");
  $("#toast").textContent = ""; $("#toast-alt").textContent = "";
  el.textContent = msg || "";
  clearTimeout(toastTimer);
  if (msg) toastTimer = setTimeout(function () { el.textContent = ""; }, 7000);
}
function run(action, body, after) {
  return act(action, body).then(function (d) { toast(""); if (after) after(d); return d; }).catch(function (e) { toast(e.message); });
}

/* ------------------------------------------------ lookups */
function S(id) { return G.sessions.find(function (s) { return s.id === id; }); }
function A(id) { return G.agents.find(function (a) { return a.id === id; }); }
function F(id) { return G.folders.find(function (f) { return f.id === id; }); }
function kindOf(id) { return id === "m" ? "master" : id[0] === "f" ? "folder" : id[0] === "s" ? "session" : "agent"; }
function sName(s) { return s.display || s.name || s.title || s.sid.slice(0, 8); }
function label(id) {
  var k = kindOf(id);
  if (k === "session") { var s = S(id); return s ? sName(s) : id.slice(2, 10); }
  if (k === "agent") { var a = A(id), p = a && S("s:" + a.sid); return "↳ " + (a ? a.type : "agent") + (p ? " · " + sName(p) : ""); }
  return "";
}
var STATUS_TEXT = { working: "Working", waiting: "Needs you", idle: "Idle", paused: "Paused", closed: "Closed", done: "Finished", stopped: "Stopped", live: "Open" };

/* ------------------------------------------------ graph model */
function buildTree() {
  var root = { id: "m", kind: "master", d: null, kids: [] };
  var fm = new Map(), sm = new Map(), am = new Map();
  G.folders.forEach(function (f) { var n = { id: f.id, kind: "folder", d: f, kids: [] }; fm.set(f.id, n); root.kids.push(n); });
  G.sessions.forEach(function (s) { sm.set(s.id, { id: s.id, kind: "session", d: s, kids: [] }); });
  G.sessions.forEach(function (s) { // a sub-session hangs under the session that split it off; others under their folder
    var n = sm.get(s.id), p = s.parent && sm.get(s.parent);
    if (p && p !== n) p.kids.push(n);
    else { var f = fm.get(s.folder); if (f) f.kids.push(n); }
  });
  G.agents.forEach(function (a) { am.set(a.id, { id: a.id, kind: "agent", d: a, kids: [] }); });
  G.agents.forEach(function (a) { var p = am.get(a.parent) || sm.get(a.parent) || sm.get("s:" + a.sid); if (p && p.id !== a.id) p.kids.push(am.get(a.id)); });
  return root;
}
function defaultLayout(root) {
  var row = 0, def = new Map(), parent = new Map(), order = [], seen = new Set();
  (function walk(n, depth, p) {
    if (seen.has(n.id)) return;
    seen.add(n.id); parent.set(n.id, p); order.push(n); n.depth = depth;
    n.kids = n.kids.filter(function (k) { return !seen.has(k.id); });
    var cx = n.kind === "folder" ? 78 + n.d.w / 2 : colX(depth);
    if (!n.kids.length) { def.set(n.id, [cx, row * ROW]); row++; return; }
    n.kids.forEach(function (k) { walk(k, depth + 1, n.id); });
    var ys = n.kids.map(function (k) { return def.get(k.id)[1]; });
    def.set(n.id, [cx, (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2]);
  })(root, 0, null);
  return { def: def, parent: parent, order: order };
}
/* Where every block goes. Blocks you placed stay put. Every other block keeps its spot relative to its parent,
   then slides down until it touches nothing already placed; its branch follows because children are placed
   after it, relative to where it ended up. */
var GAP = 16;
function rectAt(kind, p, d) { var s = dims(kind, d); return [p[0] - s[0] / 2 - GAP / 2, p[1] - s[1] / 2 - GAP / 2, p[0] + s[0] / 2 + GAP / 2, p[1] + s[1] / 2 + GAP / 2]; }
function overlaps(a, b) { return a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3]; }
function placeAll(L) {
  var T = new Map(), placed = [];
  function slide(kind, t, d) {
    for (var guard = 0; guard < 500; guard++) {
      var r = rectAt(kind, t, d), block = null;
      for (var i = 0; i < placed.length; i++) if (overlaps(r, placed[i])) { block = placed[i]; break; }
      if (!block) break;
      t[1] = block[3] + SIZE[kind][1] / 2 + GAP / 2 + 0.5;
    }
    return t;
  }
  // blocks you placed go first, in tree order; if two of them overlap, the later one slides off
  L.order.forEach(function (n) { if (saved[n.id]) { var t = slide(n.kind, saved[n.id].slice(), n.d); placed.push(rectAt(n.kind, t, n.d)); T.set(n.id, t); } });
  L.order.forEach(function (n) {
    if (saved[n.id]) return;
    var p = L.parent.get(n.id), d = L.def.get(n.id), t;
    if (p == null) t = d.slice();
    else { var pt = T.get(p), pd = L.def.get(p); t = [pt[0] + d[0] - pd[0], pt[1] + d[1] - pd[1]]; }
    for (var guard = 0; guard < 500; guard++) {
      var r = rectAt(n.kind, t, n.d), block = null;
      for (var i = 0; i < placed.length; i++) if (overlaps(r, placed[i])) { block = placed[i]; break; }
      if (!block) break;
      t[1] = block[3] + SIZE[n.kind][1] / 2 + GAP / 2 + 0.5;
    }
    placed.push(rectAt(n.kind, t, n.d));
    T.set(n.id, t);
  });
  return T;
}
function statusOf(n) { return n.kind === "session" || n.kind === "agent" ? n.d.status : ""; }
function markLive(n) { var kids = n.kids.map(markLive).some(Boolean); n.live = statusOf(n) === "working" || kids; return n.live; }

function sync() {
  $("#empty").hidden = G.sessions.length > 0;
  if (!G.sessions.length) $("#empty").textContent = "No sessions yet. Open one anywhere, or click Master and pick a folder to start one.";
  G.folders.forEach(function (f) { f.w = folderW(f); });
  folderExtra = Math.max(0, Math.max.apply(null, [FOLDER_W].concat(G.folders.map(function (f) { return f.w; }))) - FOLDER_W);
  var root = buildTree(), L = defaultLayout(root);
  markLive(root);
  var T = placeAll(L), present = new Set();
  L.order.forEach(function (n) {
    present.add(n.id);
    var t = T.get(n.id), r = N.get(n.id);
    if (!r) {
      var pr = N.get(L.parent.get(n.id));
      var start = ready && pr ? [pr.x, pr.y] : t; // new nodes grow out of their parent
      var el = document.createElementNS(SVGNS, "g");
      el.setAttribute("tabindex", "0"); el.setAttribute("role", "button"); el.dataset.id = n.id;
      r = { id: n.id, el: el, x: start[0], y: start[1], vx: 0, vy: 0, sig: "" };
      N.set(n.id, r);
      gNodes.appendChild(el);
    }
    r.kind = n.kind; r.d = n.d; r.parent = L.parent.get(n.id); r.kids = n.kids.map(function (k) { return k.id; });
    r.live = !!n.live; r.tx = t[0]; r.ty = t[1];
    var sig = JSON.stringify([n.kind, n.d, n.live, sheet.id === n.id, n.kind === "folder" ? n.kids.filter(function (k) { return k.d.live; }).length : 0, n.kind === "folder" && !!armed && armed.action === "folder_close" && armed.sid === n.id]);
    if (sig !== r.sig) {
      r.sig = sig;
      r.el.setAttribute("class", "node " + n.kind + (statusOf(n) ? " st-" + statusOf(n) : "") + (sheet.id === n.id ? " sel" : ""));
      r.el.setAttribute("aria-label", ariaOf(n));
      r.el.innerHTML = '<g class="in">' + nodeInner(n) + "</g>";
    }
  });
  N.forEach(function (r, id) { if (!present.has(id)) { r.el.remove(); N.delete(id); var e = EDGES.get(id); if (e) { e.remove(); EDGES.delete(id); } } });
  if (sheet.id && !N.has(sheet.id)) closeSheet();
  kick();
}
function ariaOf(n) {
  if (n.kind === "master") return "Master";
  if (n.kind === "folder") return "Folder " + n.d.name;
  if (n.kind === "session") return "Session " + sName(n.d) + ", " + (STATUS_TEXT[n.d.status] || n.d.status);
  return "Agent " + n.d.type + ", " + (STATUS_TEXT[n.d.status] || n.d.status);
}
function glyph(status, cx, cy, r) {
  if (status === "working") return '<circle class="ring" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/><circle class="dot" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
  if (status === "paused") return '<rect class="pause" x="' + (cx - 4.4) + '" y="' + (cy - 5) + '" width="2.6" height="10" rx="1"/><rect class="pause" x="' + (cx + 1) + '" y="' + (cy - 5) + '" width="2.6" height="10" rx="1"/>';
  if (status === "closed") return '<path class="xmark" d="M' + (cx - 4) + " " + (cy - 4) + "l8 8M" + (cx + 4) + " " + (cy - 4) + 'l-8 8"/>';
  if (status === "done") return '<path class="check" d="M' + (cx - 5) + " " + cy + "l3.5 3.5L" + (cx + 5) + " " + (cy - 3.5) + '"/>';
  return '<circle class="dot" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
}
function box(w, h, rx) { return '<rect class="box" x="' + -w / 2 + '" y="' + -h / 2 + '" width="' + w + '" height="' + h + '" rx="' + rx + '" filter="url(#shadow)"/>'; }
function nodeInner(n) {
  var w, h;
  if (n.kind === "master") return (n.live ? '<circle class="m-ring" r="30"/>' : "") + '<circle class="m-core" r="30" filter="url(#shadow)"/><text class="m-t" y="4.5">Master</text>';
  if (n.kind === "folder") {
    w = dims("folder", n.d)[0]; h = SIZE.folder[1];
    var f = n.d, open = n.kids.filter(function (k) { return k.d.live; }).length;
    return box(w, h, 13) +
      '<path class="ico" transform="translate(' + (-w / 2 + 14) + ' -8)" d="M0 1.5h5l2 2h7v11H0z"/>' +
      '<text class="nm" x="' + (-w / 2 + 40) + '" y="-3">' + esc(fitText(f.name, "600 13px", w - 84)) + "</text>" +
      '<text class="sub" x="' + (-w / 2 + 40) + '" y="13">' + esc(fitText(folderSub(f), "400 11.5px", w - 84)) + "</text>" +
      (open ? '<rect class="cntbg" x="' + (w / 2 - 34) + '" y="-10" width="22" height="20" rx="10"/><text class="cnt" x="' + (w / 2 - 23) + '" y="4">' + open + "</text>" : "") +
      '<g class="fclose' + (armed && armed.action === "folder_close" && armed.sid === n.id ? " armed" : "") + '" data-fclose="' + esc(n.id) + '" transform="translate(' + (w / 2 - 12) + ' ' + (-h / 2 + 12) + ')">' +
      '<title>' + (armed && armed.action === "folder_close" && armed.sid === n.id ? "Click again to pause its sessions and stop tracking it" : "Stop tracking this folder") + '</title>' +
      '<circle class="fbg" r="9"/><path class="fic" d="M-3 -3l6 6M3 -3l-6 6"/></g>';
  }
  if (n.kind === "session") {
    w = SIZE.session[0]; h = SIZE.session[1];
    var s = n.d, tag = s.owned || s.origin === "board" ? (agentList().length > 1 ? cut(String(s.agent_label || "").toUpperCase(), 8) : "BOARD") : s.kind === "bg" ? "BG" : "";
    return box(w, h, 15) + glyph(s.status, -w / 2 + 18, 0, 4.5) +
      '<text class="nm" x="' + (-w / 2 + 32) + '" y="-4">' + esc(cut(sName(s), tag ? 21 : 27)) + "</text>" +
      '<text class="sub" x="' + (-w / 2 + 32) + '" y="13">' + esc(cut(s.subtitle || s.cwd, 34)) + "</text>" +
      (tag ? '<text class="tagt" x="' + (w / 2 - 14) + '" y="-4" text-anchor="end">' + tag + "</text>" : "");
  }
  w = SIZE.agent[0]; h = SIZE.agent[1];
  var a = n.d;
  return box(w, h, 22) + glyph(a.status, -w / 2 + 19, 0, 4) +
    '<text class="nm" x="' + (-w / 2 + 32) + '" y="-3">' + esc(cut(a.type, 22)) + "</text>" +
    '<text class="sub" x="' + (-w / 2 + 32) + '" y="12">' + esc(cut(a.desc, 28)) + "</text>";
}
function drawEdges() {
  N.forEach(function (c, id) {

  var at = v.slice(0, c).match(/(^|\s)@([^\s@]*)$/);
  if (at) return { mode: "file", q: at[2], start: c - at[2].length - 1, end: c + rest };
  return null;
}
function acContext() { // where suggestions come from: the session, or the folder a new session will start in
  if (composerMode === "session") { var s = S(sheet.id); return s && s.owned ? { sid: s.sid, cmdKey: s.sid } : null; }
  if (composerMode === "new") return VALS["n:cwd"] ? { cwd: VALS["n:cwd"], cmdKey: "_" } : null;
  return null;
}
function updateAC() {
  var ctx = acContext();
  if (!ctx) return closeAC();
  var tk = tokenAtCaret();
  if (!tk) return closeAC();
  AC.mode = tk.mode; AC.start = tk.start; AC.end = tk.end;
  if (tk.mode === "cmd") {
    var q = tk.q.toLowerCase();
    var list = (CMDS.get(ctx.cmdKey) || []).filter(function (c) { return c.name.toLowerCase().indexOf(q) >= 0 || (q.length > 2 && (c.description || "").toLowerCase().indexOf(q) >= 0); });
    list.sort(function (a, b) { var pa = a.name.toLowerCase().indexOf(q) === 0, pb = b.name.toLowerCase().indexOf(q) === 0; return (pb - pa) || a.name.localeCompare(b.name); });
    showAC(list.slice(0, 9).map(function (c) {
      return { insert: "/" + c.name + " ", html: "<b>/" + esc(c.name) + "</b>" + (c.hint ? '<span class="hint">' + esc(c.hint) + "</span>" : "") + '<span class="d">' + esc(c.description) + "</span>" };
    }));
    return;
  }
  var id = ++AC.req;
  clearTimeout(AC.timer);
  AC.timer = setTimeout(function () {
    act("files", ctx.sid ? { sid: ctx.sid, q: tk.q } : { cwd: ctx.cwd, q: tk.q }).then(function (d) {
      if (id !== AC.req) return;
      showAC((d.files || []).map(function (f) { return { insert: "@" + f + " ", html: '<span class="f">' + esc(f) + "</span>" }; }));
    }).catch(closeAC);
  }, 110);
}
function showAC(items) {
  clearTimeout(blurTimer);
  AC.items = items; AC.idx = 0; AC.open = items.length > 0;
  var el = $("#ac");
  el.hidden = !AC.open;
  $("#reply").setAttribute("aria-expanded", AC.open);
  if (!AC.open) return;
  el.innerHTML = items.map(function (it, i) { return '<div class="ac-i' + (i === AC.idx ? " on" : "") + '" role="option" data-i="' + i + '" aria-selected="' + (i === AC.idx) + '">' + it.html + "</div>"; }).join("");
}
function moveAC(d) {
  AC.idx = (AC.idx + d + AC.items.length) % AC.items.length;
  Array.prototype.forEach.call($("#ac").children, function (c, i) { c.classList.toggle("on", i === AC.idx); c.setAttribute("aria-selected", i === AC.idx); if (i === AC.idx) c.scrollIntoView({ block: "nearest" }); });
}
function acceptAC(i) {
  var it = AC.items[i];
  if (!it) return;
  var t = $("#reply"), v = t.value;
  t.value = v.slice(0, AC.start) + it.insert + v.slice(AC.end).replace(/^\s/, "");
  var caret = AC.start + it.insert.length;
  t.setSelectionRange(caret, caret);
  closeAC(); autoGrow(); t.focus();
}
function closeAC() { AC.open = false; AC.items = []; $("#ac").hidden = true; $("#reply").setAttribute("aria-expanded", false); }
$("#ac").addEventListener("mousedown", function (e) { var it = e.target.closest(".ac-i"); if (it) { e.preventDefault(); acceptAC(+it.dataset.i); } });

var sending = false;
function sendReply(now) {
  var id = sheet.id, s = S(id), text = $("#reply").value, l = (ATTS.get(id) || []).slice(), isNew = composerMode === "new", cwd = VALS["n:cwd"];
  if (sending || (!text.trim() && !l.length) || (!isNew && !s)) return;
  if (isNew && !VALS["n:cwd"]) { toast("Choose a folder first."); return; }
  closeAC();
  sending = true; $("#send").disabled = true;
  toast("");
  Promise.all(l.map(prepare))
    .then(function (atts) {
      if (isNew) return act("new", { cwd: VALS["n:cwd"], prompt: text, agent: VALS["n:agent"], mode: VALS["n:mode"], model: VALS["n:model"], effort: VALS["n:effort"], attachments: atts });
      return act("send", { sid: s.sid, text: text, attachments: atts, now: now === true });
    })
    .then(function (d) {
      if (sheet.id === id) { $("#reply").value = ""; }
      drafts.delete(id); clearAtts(id);
      if (sheet.id === id) renderAtts();
      toast("");
      // in a folder, the new session appears as a window and you stay; from Master you go to its folder
      if (id === "m" && sheet.id === "m") {
        var fo = G.folders.find(function (x) { return x.abs === cwd; }), ch = folderChoices().find(function (c) { return c[0] === cwd; });
        if (!fo && ch) { addFolder({ path: cwd, tilde: ch[2], name: ch[1] }); fo = F("f:" + cwd); }
        if (fo) openSheet(fo.id);
      }
    })
    .catch(function (e) { toast(e.message); })
    .then(function () { sending = false; autoGrow(); });
}
$("#f-reply").addEventListener("submit", function (e) { e.preventDefault(); sendReply(); });
$("#reply").addEventListener("keydown", function (e) {
  if (AC.open) {
    if (e.key === "ArrowDown") { e.preventDefault(); return moveAC(1); }
    if (e.key === "ArrowUp") { e.preventDefault(); return moveAC(-1); }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return acceptAC(AC.idx); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeAC(); }
  }
  var s = S(sheet.id);
  if (e.key === "Tab" && !e.shiftKey && s && s.suggestion && !$("#reply").value) { e.preventDefault(); $("#reply").value = s.suggestion; autoGrow(); return; }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendReply(e.metaKey || e.ctrlKey); }
});
function autoGrow() {
  var t = $("#reply"), s = sheet.id && S(sheet.id);
  $("#send").disabled = sending || (!t.value.trim() && !(ATTS.get(sheet.id) || []).length) || (composerMode === "new" && !VALS["n:cwd"]);
  $("#tabkey").hidden = !(s && s.suggestion && !t.value);
  if (!t.getClientRects().length) return; // hidden: a measurement now would be 0 and clip the text later
  t.style.height = "auto";
  var h;
  if (!t.value && t.placeholder) { t.value = t.placeholder; h = t.scrollHeight; t.value = ""; } // fit a long suggestion
  else h = t.scrollHeight;
  t.style.height = Math.min(Math.max(h, 33), 220) + "px";
}
var blurTimer = 0;
$("#reply").addEventListener("input", function () { autoGrow(); updateAC(); });
$("#reply").addEventListener("click", updateAC);
$("#reply").addEventListener("blur", function () { blurTimer = setTimeout(closeAC, 150); });
/* @ and / buttons: put the trigger in and open the suggestions */
function insertTrigger(ch) {
  var t = $("#reply"), v = t.value, a = t.selectionStart, b = t.selectionEnd, c;
  if (ch === "/") { // commands only count at the start of the message
    t.value = v.trim() ? "/ " + v.replace(/^\s+/, "") : "/";
    c = 1;
  } else {
    var pre = v.slice(0, a), ins = pre && !/\s$/.test(pre) ? " @" : "@";
    t.value = pre + ins + v.slice(b);
    c = a + ins.length;
  }
  t.focus(); t.setSelectionRange(c, c);
  autoGrow(); updateAC();
}
["#ins-at", "#ins-slash"].forEach(function (sel) {
  var b = $(sel);
  b.addEventListener("mousedown", function (e) { e.preventDefault(); }); // keep the caret in the message box
  b.addEventListener("click", function () { insertTrigger(sel === "#ins-at" ? "@" : "/"); });
});

/* ------------------------------------------------ chrome */
function fmtReset(iso) {
  if (!iso) return "";
  var d = new Date(iso), n = new Date(), hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  return d - n < 20 * 3600e3 ? hm : d.toLocaleDateString([], { weekday: "short" }) + " " + hm;
}
function newer(a, b) {
  var pa = String(a || "").split(".").map(Number), pb = String(b || "").split(".").map(Number);
  for (var i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0);
  return false;
}
function renderChrome() {
  var u = G.usage, el = $("#usage");
  el.hidden = !u.enabled; $("#u-refresh").hidden = !u.enabled;
  $("#u-refresh").disabled = !!u.busy;
  if (!u.enabled) el.innerHTML = "";
  else if (!u.data) el.innerHTML = '<span class="meter" title="' + esc(u.error || "") + '">' + (u.error ? "Usage unavailable" : "Checking usage…") + "</span>";
  else {
    var names = { session: "5h", weekly_all: "Week" };

      var nm = names[l.kind] || l.label || "Scoped", p = Math.max(0, Math.min(100, Math.round(l.percent)));
      var full = l.resets_at ? new Date(l.resets_at).toLocaleString() : "";

    }).join("") || '<span class="meter">No limits reported</span>';
  }
  var r = G.release;
  $("#release").innerHTML = r && r.latest && r.installed && newer(r.latest, r.installed)
    ? '<button class="chip-up" id="upchip" title="Claude Code ' + esc(r.latest) + " is out. You have " + esc(r.installed) + '. Click to copy: claude update">Update ' + esc(r.latest) + "</button>" : "";

}
$("#u-refresh").addEventListener("click", function () { run("usage", {}); });
$("#release").addEventListener("click", function (e) {

});
window.addEventListener("resize", function () { if (sheet.id) applySheet(); });

connect();
})();
